<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكتب التلواني للنقل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <!-- مكتبات الخرائط المجانية (نسخة مستقرة وسريعة) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f9fafb; display: flex; flex-direction: column; height: 100vh; }
        #map { flex: 1; width: 100%; min-height: 40vh; z-index: 1; background-color: #e5e7eb; }
        .bottom-sheet { z-index: 20; background: white; border-radius: 24px 24px 0 0; padding: 24px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <!-- الشعار والرأس -->
    <header class="bg-white shadow-md py-4 text-center z-10">
        <h1 class="text-2xl font-bold text-gray-800">مكتب التلواني للنقل</h1>
    </header>

    <!-- مساحة الخريطة -->
    <div id="map"></div>

    <!-- لوحة التحكم وحساب النولون -->
    <div class="bottom-sheet">
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">التحميل من:</label>
            <input id="origin-input" type="text" placeholder="اكتب اسم المدينة (مثال: السادات)..." class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">التنزيل إلى:</label>
            <input id="destination-input" type="text" placeholder="اكتب اسم المدينة (مثال: الإسماعيلية)..." class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <button onclick="calculateRoute()" id="calc-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-200">
            حساب النولون
        </button>

        <!-- صندوق النتيجة -->
        <div id="result-box" class="hidden mt-6 p-4 bg-gray-100 rounded-xl border border-gray-200">
            <div class="flex justify-between items-center mb-2">
                <span class="text-gray-600">مسافة الرحلة:</span>
                <span id="distance-val" class="font-bold text-gray-800">0 كم</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-gray-600">إجمالي نولون النقل:</span>
                <span id="nolon-val" class="font-bold text-blue-600 text-xl">0 ج.م</span>
            </div>
        </div>
    </div>

    <script>
        let map;
        
        // تهيئة الخريطة فور تحميل الصفحة
        document.addEventListener("DOMContentLoaded", function() {
            try {
                map = L.map('map', {zoomControl: false}).setView([29.0, 31.0], 5);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(map);
            } catch(e) {
                console.error("خطأ في تهيئة الخريطة:", e);
            }
        });

        async function calculateRoute() {
            const origin = document.getElementById("origin-input").value.trim();
            const destination = document.getElementById("destination-input").value.trim();
            const btn = document.getElementById("calc-btn");

            if (!origin || !destination) {
                alert("يرجى كتابة نقطة التحميل ونقطة التنزيل أولاً.");
                return;
            }

            btn.innerText = "جاري الحساب ورسم الطريق...";
            btn.disabled = true;

            try {
                // البحث عن الإحداثيات
                const getCoords = async (place) => {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place + " مصر")}`);
                    const data = await res.json();
                    if(data.length === 0) throw new Error(`لم نتمكن من العثور على: ${place}، يرجى كتابة الاسم بوضوح أكبر.`);
                    return { lat: data[0].lat, lon: data[0].lon };
                };

                const originCoords = await getCoords(origin);
                const destCoords = await getCoords(destination);

                // رسم المسار وحساب المسافة
                const routeRes = await fetch(`https://router.project-osrm.org/route/v1/driving/${originCoords.lon},${originCoords.lat};${destCoords.lon},${destCoords.lat}?overview=full&geometries=geojson`);
                const routeData = await routeRes.json();

                if (routeData.code !== "Ok") throw new Error("حدث خطأ في قراءة شبكة الطرق بين المدينتين.");

                const distanceInKm = routeData.routes[0].distance / 1000;
                
                if (window.currentRoute) map.removeLayer(window.currentRoute);
                if (window.oMarker) map.removeLayer(window.oMarker);
                if (window.dMarker) map.removeLayer(window.dMarker);

                window.currentRoute = L.geoJSON(routeData.routes[0].geometry, { style: { color: '#2563eb', weight: 5 } }).addTo(map);
                window.oMarker = L.marker([originCoords.lat, originCoords.lon]).addTo(map);
                window.dMarker = L.marker([destCoords.lat, destCoords.lon]).addTo(map);
                map.fitBounds(window.currentRoute.getBounds(), { padding: [40, 40] });

                // تطبيق معادلة التسعير
                let basicNolon = 0;
                if (distanceInKm <= 25) {
                    basicNolon = 1250;
                } else if (distanceInKm <= 50) {
                    basicNolon = 1800;
                } else if (distanceInKm <= 70) {
                    basicNolon = 2800;
                } else if (distanceInKm <= 100) {
                    basicNolon = 3000;
                } else if (distanceInKm <= 150) {
                    basicNolon = 3300;
                } else {
                    const scalePrice = 3300 + ((distanceInKm - 150) / (1200 - 150)) * (17000 - 3300);
                    const avgPriceBy14 = (distanceInKm * 2) * 14; 
                    basicNolon = (scalePrice + avgPriceBy14) / 2;
                    if (distanceInKm >= 1200) {
                        basicNolon = 17000;
                    }
                }

                // إظهار النتيجة
                document.getElementById("distance-val").innerText = distanceInKm.toFixed(1) + " كم";
                document.getElementById("nolon-val").innerText = Math.round(basicNolon) + " ج.م";
                document.getElementById("result-box").classList.remove("hidden");

            } catch (error) {
                alert("تنبيه: " + error.message);
            } finally {
                btn.innerText = "حساب النولون";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
